[build]
  base = "client"
  command = "npm install --prefix ../server && npm install && npm run build"
  publish = "dist"
  functions = "../server/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
